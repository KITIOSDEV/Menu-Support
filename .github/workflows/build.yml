name: Build iOS Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5 # Nâng cấp lên v5 để sử dụng Node 24

      - name: Setup Theos
        uses: actions/checkout@v5 # Nâng cấp lên v5
        with:
          repository: theos/theos
          path: theos
          submodules: true

      - name: Download iOS SDKs
        run: |
          git clone https://github.com/theos/sdks.git theos/sdks

      - name: Build Tweak
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v5 # Nâng cấp lên v5 để tương thích hệ thống mới
        with:
          name: MenuSupport-Dylib
          path: .theos/obj/debug/*.dylib
